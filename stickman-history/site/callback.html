<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShortHistory - sign-in code</title>
<style>body{font-family:system-ui,sans-serif;max-width:640px;margin:48px auto;padding:0 16px;color:#1b1b1b}
code{display:block;word-break:break-all;background:#f1f1f1;padding:12px;border-radius:6px;margin:12px 0}
button{padding:8px 14px;font-size:16px}</style></head>
<body>
<h1>Sign-in code</h1>
<div id="out"></div>
<p>This page only shows the code in your own browser. Nothing is sent anywhere. Copy it and paste it into the terminal window that is waiting for it.</p>
<script>
(function () {
  var p = new URLSearchParams(location.search), out = document.getElementById('out');
  var code = p.get('code'), err = p.get('error_description') || p.get('error');
  if (code) {
    out.innerHTML = '<p>Copy this code:</p><code id="c"></code><button id="b">Copy</button>';
    document.getElementById('c').textContent = code;
    document.getElementById('b').onclick = function () {
      navigator.clipboard.writeText(code).then(function () { document.getElementById('b').textContent = 'Copied'; });
    };
  } else {
    out.textContent = err ? 'The sign-in failed: ' + err : 'No code in this address. Start the sign-in again from the terminal.';
  }
})();
</script></body></html>
